# Local Postgres + pgvector for development (spec 02 step 1).
#
#   docker compose up -d       start in the background
#   docker compose ps          is it running and healthy?
#   docker compose down        stop (the data is kept in the pgdata volume)
#   docker compose down -v     stop and delete the data
#
# Port 5433 on 127.0.0.1 only: 5432 is taken by a local Postgres, and nothing outside
# this machine may connect. The password comes from .env, never from this file.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
