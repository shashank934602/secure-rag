# Secret scanning rules (ISS-071): gitleaks' defaults plus the providers this project uses.
# The defaults have no Groq rule, and their generic rule needs a word like "key" or "secret"
# nearby, so `GROQ = "gsk_…"` slipped through in testing (2026-11-05).
[extend]
useDefault = true

[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''\bgsk_[A-Za-z0-9]{52}\b'''
keywords = ["gsk_"]

[[rules]]
id = "mistral-api-key"
description = "Mistral API key (32 characters next to the word mistral)"
regex = '''(?i)mistral[\w.-]{0,25}\s*[:=]\s*['"]?([A-Za-z0-9]{32})\b'''
secretGroup = 1
keywords = ["mistral"]

[[rules]]
id = "openai-project-key"
description = "OpenAI project key (sk-proj-…); the default OpenAI rule misses this format"
regex = '''\bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{40,}'''
keywords = ["sk-proj-", "sk-svcacct-", "sk-admin-"]

[[rules]]
id = "database-url-password"
description = "A database URL with a password in it"
regex = '''\b(?:postgres(?:ql)?|mysql|redis|mongodb)(?:\+\w+)?://[^:\s/@]+:([^@\s<>${}]{6,})@'''
secretGroup = 1
keywords = ["postgres", "mysql", "redis", "mongodb"]
[rules.allowlist]
regexes = ['''^ci-throwaway''', '''^test-''']  # CI's per-run container, test fixtures

[[rules]]
id = "base64-private-key"
description = "A base64-encoded PEM private key (the format JWT_PRIVATE_KEY uses in .env)"
regex = '''LS0tLS1CRUdJTi[A-Za-z0-9+/]{0,40}(?:UFJJVkFURS|QUklWQVRF|SVZBVEUg)[A-Za-z0-9+/=]{200,}'''
keywords = ["ls0tls1crudjti"]

[[rules]]
id = "dotenv-file"
description = "A committed .env file (only .env.example belongs in git)"
path = '''(^|/)(\.env(\.[\w-]+)?|[\w.-]+\.env)$'''
[rules.allowlist]
paths = ['''(^|/)\.env\.example$''']
