# Alembic: versions the database schema (spec 02 D1). Migrations are raw SQL.
#
#   uv run alembic -c db/alembic.ini upgrade head      apply every migration not yet applied
#   uv run alembic -c db/alembic.ini current           which migration is the database at?
#   uv run alembic -c db/alembic.ini history           list all migrations
#
# The database URL is not here: env.py reads DATABASE_ADMIN_URL from the environment / .env.

[alembic]
script_location = %(here)s
version_locations = %(here)s/migrations
prepend_sys_path = %(here)s/..
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
